services:
  - type: web
    name: testes-requisitos
    runtime: docker
    plan: free
    repo: https://github.com/Raiagues/testes_requisitos
    branch: main
    rootDir: norte
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        fromService:
          type: web
          name: testes-requisitos
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://pdkceggaucuanisybbak.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_p_q911S_30e4vLUCQQK1ug_Wlv2pGQm
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SERVICE_OWNER
        value: Norte
      - key: PRIVACY_CONTACT
        value: nortetestesoficial@gmail.com
      - key: REQUIREMENTS_AI_PROVIDER
        value: none
      - key: GEMINI_HELP_APPROVED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_DAILY_CALL_LIMIT
        value: "20"
      - key: AI_MAX_CONCURRENCY
        value: "1"
      - key: REQUIREMENTS_AI_APPROVED
        value: "false"
