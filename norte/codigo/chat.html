<button type="button" class="n-chat-launcher" id="chat-launcher" data-norte="chat-toggle" aria-expanded="false" aria-controls="norte-chat"><svg><use href="#i-chat"/></svg>Ajuda</button>
<section class="n-chat" id="norte-chat" aria-label="Ajuda Norte" hidden>
<div class="n-chat-header"><span class="chat-mark"><svg><use href="#i-compass"/></svg></span><div><strong>Ajuda Norte</strong><small>Um caminho para sua próxima etapa</small></div><button type="button" class="icon-button" data-norte="chat-close" aria-label="Fechar ajuda"><svg><use href="#i-close"/></svg></button></div>
