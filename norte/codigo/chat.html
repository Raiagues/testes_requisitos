<button type="button" class="n-chat-launcher" id="chat-launcher" data-norte="chat-toggle" aria-expanded="false" aria-controls="norte-chat"><svg><use href="#i-chat"/></svg>Ajuda</button>
<section class="n-chat" id="norte-chat" aria-label="Ajuda Norte" hidden>
<div class="n-chat-header"><div><strong>Ajuda Norte</strong><small>Respostas rápidas sobre o serviço</small></div><button type="button" class="icon-button" data-norte="chat-close" aria-label="Fechar ajuda"><svg><use href="#i-close"/></svg></button></div>
<div class="n-chat-body" id="chat-body" role="log" aria-live="polite"><p class="n-chat-message">Qual parte você quer entender?</p></div>
<div class="n-chat-quick"><button data-norte="chat-question">O que recebo?</button><button data-norte="chat-question">Quem revisa?</button><button data-norte="chat-question">Dados e acesso</button><button data-norte="chat-question">Preço e desconto</button><button data-norte="chat-question">Prazos</button></div>
<form class="n-chat-form" id="chat-form"><input type="text" id="chat-question" aria-label="Sua pergunta" placeholder="Ou escreva sua dúvida" maxlength="500" autocomplete="off"><button type="submit" class="icon-button" aria-label="Enviar pergunta"><svg><use href="#i-arrow"/></svg></button></form>
</section>
